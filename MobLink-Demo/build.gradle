apply plugin: 'com.android.application'
apply from: 'build-mix.gradle'
apply plugin: 'com.mob.sdk'

android {
    compileSdkVersion 30
    buildToolsVersion '30.0.2'
    ndkVersion '21.1.6352462'
    defaultConfig {
        applicationId findApplicationId()
        minSdkVersion 16
        targetSdkVersion 30
        versionCode findVersionCode()
        versionName findVersionName()
    }


    signingConfigs {
        config {
            storeFile file("demokey.keystore")
            storePassword "123456"
            keyAlias "demokey.keystore"
            keyPassword "123456"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.config
            zipAlignEnabled true
            minifyEnabled false
        }
        debug {
            signingConfig signingConfigs.config
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            assets.srcDirs = ['assets']
            java.srcDirs = ['src']
            aidl.srcDirs = ['src']
            res.srcDirs = ['res']
            jniLibs.srcDirs = ['libs']
        }

        test {
            root = ['test']
            java.srcDirs = ['test']
        }
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_6
        targetCompatibility JavaVersion.VERSION_1_6
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation group: 'com.google.zxing', name: 'core', version: '3.3.3'
    Project p = findProject(':MobLink')
    if (null != p) {
        releaseimplementation project(path: ':MobLink', configuration: 'release')
        debugimplementation project(path: ':MobLink', configuration: 'debug')
    } else {
        MobSDK {
            MobLink {
				version = "3.0.2"
                uriScheme "mlink://com.mob.moblink.demo"
                appLinkHost "z.t4m.cn"
            }
        }
    }
    implementation 'junit:junit:4.12'
    implementation 'org.robolectric:robolectric:3.3.2'
}

