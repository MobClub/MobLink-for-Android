// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    String urlStr = "http://mvn.mob.com/android"
	String mavenUrlP = rootProject.ext.mavenUrl
    if (mavenUrlP != null) {
        urlStr = mavenUrlP
    }
    println "mavenUrl: ${urlStr}"
    ext {
        mavenUrlExt = urlStr
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:4.0.1'
        classpath 'com.mob.sdk:MobSDK:+'
        classpath 'com.mob.eclipsemodule:EclipseModule:+'
    }

    repositories {
        jcenter()
        maven {
            url "http://maven.aliyun.com"
        }
        maven {
            url mavenUrlExt
        }
        jcenter()
        google()
    }
}

allprojects {
    repositories {
        jcenter()
        google()
        maven {
            url "http://maven.aliyun.com"
        }
        maven {
            url mavenUrlExt
        }
    }
}
